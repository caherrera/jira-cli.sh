name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:bookworm-slim
            label: debian
          - image: rockylinux:9
            label: rocky
          - image: alpine:3.20
            label: alpine
    runs-on: ubuntu-latest
    name: test (${{ matrix.label }})
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Install OS packages
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y bash curl jq git shellcheck
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y bash curl jq git shellcheck
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash curl jq git shellcheck
          fi

      - name: Setup dependencies
        run: bash scripts/ci-setup-deps.sh

      - name: Provide external helpers.sh (not part of this repo)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/kero-sh/shell-helpers/v2.0.5/libs/helpers.sh" -o /tmp/helpers.sh
          echo "HELPER_SCRIPT=/tmp/helpers.sh" >> "$GITHUB_ENV"

      - name: Shellcheck
        run: |
          find src lib scripts -name '*.sh' -print0 | xargs -0 shellcheck -e SC1091

      - name: Syntax check
        run: make check-scripts

      - name: Help tests
        run: bash test/test_help.sh

      - name: Version tests
        run: bash test/test_version_check.sh

      - name: Self-update tests
        run: bash test/test_self_update.sh

      - name: Unit tests
        run: make test-unit

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl jq git kcov shellcheck

      - name: Setup dependencies
        run: bash scripts/ci-setup-deps.sh

      - name: Provide external helpers.sh (not part of this repo)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/kero-sh/shell-helpers/v2.0.5/libs/helpers.sh" -o /tmp/helpers.sh
          echo "HELPER_SCRIPT=/tmp/helpers.sh" >> "$GITHUB_ENV"

      - name: Coverage
        run: make coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/kcov-merged/cobertura.xml
          fail_ci_if_error: false
