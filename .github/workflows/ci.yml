name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:bookworm-slim
            label: debian
          - image: rockylinux:9
            label: rocky
          - image: alpine:3.20
            label: alpine
    runs-on: ubuntu-latest
    name: test (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v7

      - name: Run tests in ${{ matrix.label }}
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            "${{ matrix.image }}" \
            sh -ec '
              if command -v apt-get >/dev/null 2>&1; then
                apt-get update && apt-get install -y bash curl jq git make shellcheck
              elif command -v dnf >/dev/null 2>&1; then
                dnf install -y bash jq git make epel-release
                dnf install -y shellcheck
              elif command -v apk >/dev/null 2>&1; then
                apk add --no-cache bash curl jq git make shellcheck
              fi
              exec bash /work/scripts/ci-test-matrix.sh
            '

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl jq git make shellcheck

      - name: Setup dependencies
        run: bash scripts/ci-setup-deps.sh

      - name: Provide external helpers.sh (not part of this repo)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/kero-sh/shell-helpers/v2.0.5/libs/helpers.sh" -o /tmp/helpers.sh
          echo "HELPER_SCRIPT=/tmp/helpers.sh" >> "$GITHUB_ENV"

      - name: Coverage
        run: make coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/kcov-merged/cobertura.xml
          fail_ci_if_error: false
