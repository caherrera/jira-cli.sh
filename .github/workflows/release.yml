name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          curl -fsSL https://github.com/orhun/git-cliff/releases/download/v2.6.1/git-cliff-2.6.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /tmp
          sudo mv /tmp/git-cliff-2.6.1/git-cliff /usr/local/bin/

      - name: Auto tag on main (skip when tag push)
        if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        id: autotag
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
            git push origin "v${VERSION}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        if: startsWith(github.ref, 'refs/tags/v') || steps.autotag.outputs.skip == 'false'
        run: git-cliff --config cliff.toml --output CHANGELOG.md

      - name: Build tarball
        if: startsWith(github.ref, 'refs/tags/v') || steps.autotag.outputs.skip == 'false'
        run: |
          make package
          VERSION=$(tr -d '[:space:]' < VERSION)
          mv "dist/jira-cli-${VERSION}.tar.gz" "dist/jira-cli-v${VERSION}.tar.gz"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || steps.autotag.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v$(tr -d '[:space:]' < VERSION)
          name: jira-cli v$(tr -d '[:space:]' < VERSION)
          body_path: CHANGELOG.md
          files: dist/jira-cli-v$(tr -d '[:space:]' < VERSION).tar.gz
          generate_release_notes: true
